name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      # Tests run against dist/, so the build has to happen first -- running
      # them against a stale dist would test code that is no longer here.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Tarball contains no source, tests or scratch files
        run: |
          npm pack --silent
          tarball=$(ls xfeaturesgroup-athenaeum-cli-*.tgz)
          list=$(tar -tzf "$tarball")
          echo "$list"
          if echo "$list" | grep -qE '\.test\.|package/src/|\.env'; then
            echo "Tarball contains source, tests, or an env file."
            exit 1
          fi
          for required in LICENSE README.md package.json dist/cli.js; do
            echo "$list" | grep -q "package/$required" || { echo "Missing $required."; exit 1; }
          done
          rm -f "$tarball"
          echo "Tarball verified clean."

  publishable-guard:
    name: This package is deliberately publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.private === true) { console.error('athenaeum-cli is marked private -- this package is meant to publish.'); process.exit(1); }
            if (pkg.publishConfig?.access !== 'public') { console.error('publishConfig.access must be \"public\" for a scoped package.'); process.exit(1); }
            if (!pkg.repository?.url?.includes('XfeaturesAthenaeumCLI')) { console.error('repository.url must point at this repository, exactly, for Trusted Publishing to match.'); process.exit(1); }
            if (pkg.bin?.athenaeum !== './dist/cli.js') { console.error('bin.athenaeum must point at dist/cli.js.'); process.exit(1); }
            console.log('athenaeum-cli: publishable and correctly configured.');
          "

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
      - name: Scan the working tree
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose --exit-code 1
